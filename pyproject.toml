[project]
name = "pipeline"
version = "0.1.0"
description = "Ticket-driven agent pipeline dispatcher"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "textual>=8.2.8",
]

[project.scripts]
pipeline  = "pipeline.cli.main:main"
pipelined = "pipeline.daemon.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pyright]
# `tests/helpers.py` is imported flat; conftest.py puts tests/ on sys.path at runtime.
extraPaths = ["tests"]
