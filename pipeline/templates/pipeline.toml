# How to run this project's tests. `{test}` is substituted with the ticket's
# `test_file` frontmatter value.
# The dispatcher reads this file from git HEAD, so an edit to a committed
# config takes effect once it is committed. A config git does not have --
# not yet committed, or excluded by `init --private` -- is read from disk.
test_one                = "pytest -x {test}"
test_suite              = "pytest"
test_suite_without_new  = "pytest --deselect {test}"
# `{test}` is the ticket's whole `test_file` value -- `<path>::<name>`, e.g.
# `tests/repro.rs::test_add_is_wrong`. The gate needs three things from these
# commands, so a non-pytest project splits the value itself:
#   * `<path>` must be a real file, and the gate copies it onto a checkout of
#     `base` to prove the bug is not already fixed there;
#   * `<name>` must appear in `test_one`'s output, or an errored test reads as
#     a successful reproduction;
#   * `test_suite_without_new` must run everything BUT that test. A red run
#     must exit 1 or 101, or print a test count, or the gate reports "could
#     not run" instead of pre-existing breakage.
# Each of {test}, {path} and {name} is shlex.quote'd and substituted; every
# other brace -- ${t##*::}, awk '{print $1}' -- reaches the shell as written.
#
# Cargo, verified end to end against `cargo test`:
# test_one               = "cargo test {name}"
# test_suite             = "cargo test"
# test_suite_without_new = "cargo test -- --skip {name}"

# The branch tickets are cut from, and the one Tier A re-runs {test} against.
base                    = "main"

# Lowers the daemon's -j for this project's tickets only; it never raises it.
# A project with no key leaves -j alone. A value below 1 is reported and
# ignored, and -j stands.
# max_parallel = 1

# Per-project stage overrides. A [stages.<name>] table is merged shallow onto
# that stage's packaged frontmatter -- a key here replaces the packaged one,
# it does not extend it (a `skills` list included).
# [stages.review]
# model  = "haiku"
# skills = []
# scale_usd = true
#
# review, quick-review and holistic-review grow their max_usd with the
# plan's declared files and steps, up to twice the stage's own value. A
# max_usd set here pins the cap instead, unless scale_usd = true is set
# alongside it.
#
# Prose that adds to a stage's instructions, rather than its settings, goes
# in .project/stages/<name>.extra.md instead -- appended after the packaged
# prompt and before the ticket view.

# MCP servers this project offers. A stage opts in with mcp: [docs] in its
# frontmatter; a server nobody declares is never spawned and costs no tokens.
# readonly = true is what lets a write: false stage call it at all.
# [mcp.docs]
# command = "npx"
# args = ["-y", "@upstash/context7-mcp"]
# readonly = true

# [readonly]
# allow = ["mytool status", "mytool show"]
#
# Entries are argv prefixes, matched per shell segment. They never override
# the always-blocked commands or the redirection and command-substitution
# rules. This file is read from git HEAD, so a stage cannot widen its own
# allowlist.
