# Harness adapter: data, not code. A second harness is a second file here.
# Placeholders filled by the dispatcher: model, effort_flag, session_flag,
# settings_flag, permission_mode, stage_prompt, tools, cap, project, ticket,
# result_file, id.
#
# The agent's cwd is the ticket's git worktree; the ticket file and the
# `.result` sidecar live under `<project>/.project/` in the main checkout, so
# that one directory is the extra allowed dir, not the whole checkout.
# `--add-dir {project}` used to grant that -- every other ticket's file,
# every other ticket's worktree (`<project>/.worktrees/<id>`) and the
# dispatcher's own source tree. TICKET-039 and TICKET-040 each wrote their
# work into the main checkout on 2026-08-23 (TICKET-041).
#
# `--add-dir` widens what the permission layer allows. Under `cmd`,
# `--permission-mode bypassPermissions` on the same command line removes that
# layer, so the directory list is inert there -- it enforces nothing (TICKET-052).
# It binds under `interactive_cmd`, which runs `acceptEdits`, where the
# permission layer exists. The actual enforcement is the `PreToolUse` path
# rule in `pipeline/hooks/dangerous-commands.py`, reached via
# `PIPELINE_WORKTREE`. The directory stays narrow anyway, so the flag is
# right if the permission mode under `cmd` ever changes.
#
# The `--` before the prompt is load-bearing: `--add-dir` is VARIADIC, so
# `--add-dir /p "prompt"` consumes the prompt as a second directory and claude
# exits with "Input must be provided either through stdin or as a prompt
# argument". Every stage this harness spawned died there, silently, because the
# end-to-end tests use `fake.toml`, whose command has no positional argument.

prompt_mode = "system"   # composed prompt via --append-system-prompt
supports_hooks = true    # PreToolUse hooks registered via --settings
usage_source = "claude"
replay_cmd = "claude --resume {session}"

effort_flag = "--effort {effort}"
session_flag = "--session-id {session}"
settings_flag = "--settings {settings}"
# The MCP servers this stage declared (TICKET-036), or empty for a stage that
# declared none -- `--strict-mcp-config` stays either way (DEC-025), and with
# it `--mcp-config` means "only the servers this file names".
mcp_flag = "--mcp-config {mcp}"
# `write: false` names the WORKING TREE, not the ticket. Every stage has to
# write its `.result` sidecar, and `tree_snapshot()` excludes `.project/` for
# exactly that reason -- so a read-only stage needs a file tool to do it. Given
# only Bash it cannot: the guard refuses `>`, a heredoc, and `sed -i`, which is
# the guard working as designed. Two `plan-validation` runs on 2026-08-21
# produced complete analyses, could not write them anywhere, and escalated with
# `no_result: 2`. Prevention for the shell (the guard), detection for the file
# tools (the snapshot escalates `wrote-in-readonly` at reap).
readonly_tools = "Read,Grep,Glob,Bash,Write,Edit"
write_tools = "Read,Grep,Glob,Bash,Edit,Write"
max_usd = 5

# The guard is the permission layer (CLAUDE.md invariant 4), so Claude Code's
# own prompt layer is both redundant with it and unanswerable under `-p`:
# `acceptEdits` auto-accepts file edits and NOTHING else, so every Bash command
# fell through to an approval prompt with nobody to answer it, and triage --
# whose whole job is to run a test -- could never finish. Verified 2026-08-21,
# both halves, before this was trusted: under `bypassPermissions` a PreToolUse
# hook still fires (`sudo -n ls /` came back "Blocked by the pipeline guard
# (triage)") and a legitimate write command runs with no approval error.
permission_mode = "bypassPermissions"

# ...but ONLY headless. On a real terminal `bypassPermissions` opens a modal
# ("Yes, I accept" / "No, exit") before the session starts, and a stage parked
# on that dialog is a stage nobody is steering -- TICKET-016's planning run sat
# there until it was killed. An interactive stage is the one place a permission
# prompt can be answered, which is why `interactive_cmd` exists at all, so it
# keeps the mode that asks.
interactive_permission_mode = "acceptEdits"

# The tool that lets a stage's `skills:` frontmatter mean anything. A harness
# that omits this key gets no skills block in its prompt at all -- telling an
# agent to invoke a tool it was not given is the failure mode the pipeline
# exists to prevent, and it burned a turn on every triage/planning/implementing
# run of 2026-08-21 with "No such tool available: Skill".
skill_tool = "Skill"
skill_format = "/{name}"

# ...and the flag for a stage that declares none. `--disable-slash-commands`
# ("Disable all skills") drops the Skill tool AND the slash-command listing:
# 98 commands and 22,574 tokens of opening context become 0 and 19,946 on
# `claude-haiku-4-5-20251001`. That is 2,628 tokens per TURN, and a stage
# re-reads its opening context on every one -- a 40-turn stage pays it 40
# times. `render()` only emits this where `skills:` is absent, which since
# 2026-08-22 is every stage: `triage`/`planning`/`implementing` inlined the
# three superpowers skills they used to invoke, because the logs showed them
# invoking one on 70/100 runs -- the body was being paid anyway, and the tool
# plus the 46-skill listing rode on top of it. The key stays: a future stage
# that declares a real `skills:` gets the tool back with no code change.
#
# NOT `--bare`, which also skips hooks. Note what does and does not catch that:
# `spawn()` refuses on `supports_hooks = false` (`daemon/supervisor.py:301`) --
# it never reads the flags in `cmd`, so `no_skills_flag = "--bare"` here would
# leave `supports_hooks = true` satisfied while the guard never registered.
# Nothing in the code stops that; this file is trusted shell either way, since
# `cmd` itself is a free-form template. It is also NOT in `machine.FENCED`, so
# a ticket editing it merges unattended and `_harness_reloader()` picks it up
# on the next tick. Treat any edit here as a guard edit.
# `--disable-slash-commands` is safe on that axis -- verified 2026-08-21,
# `sudo -n ls /` under it still came back "Blocked by the pipeline guard".
no_skills_flag = "--disable-slash-commands"

# Stage output is stream-json so a running stage can be watched instead of
# arriving as one blob four minutes late. `--verbose` is what makes `-p` emit
# every event rather than only the last one.
#
# Deliberately NOT here, do not "fix" this:
#   --input-format stream-json     only buys sending a message mid-run, which is
#                                  a TUI/PTY feature, and it conflicts with the
#                                  positional prompt below.
#   --include-partial-messages     ~50x the event volume, every event hitting
#                                  SQLite, to gain sub-message granularity on a
#                                  view that is already live.
# Both flags exist in `claude --help`; re-enabling either is a one-line edit.
# `--tools` restricts the built-in tool set only, not MCP. TICKET-024's
# `planning` asked for 7 tools and its `init` event granted 53 from 9
# `~/.claude` MCP servers, Gmail among them. The guard's `PreToolUse` matcher
# now also covers `mcp__.*` (TICKET-036), and `mcp_verdict()` allows a call
# only for a server the stage declared in `mcp:` -- but that server still has
# to be OFFERED to the session before any tool call can name it, which is what
# `--strict-mcp-config` and `--mcp-config` (or its absence) below control.
# Measured on `claude-haiku-4-5-20251001`,
# 2026-08-21: without `--strict-mcp-config`, `init` reports 68 tools and 9
# servers; with it, exactly `["Bash","Edit","Glob","Grep","Read","Skill",
# "Write"]` and `"mcp":[]`. `--bare` is not the alternative -- it skips hooks,
# and `spawn()` already refuses a stage that cannot register
# `dangerous-commands.py`.
#
# `--setting-sources project` is the same argument one level up: without it a
# stage inherits the whole of the operator's `~/.claude`. On this machine that
# was 6 plugins, 46 skills, and -- the part that is not about tokens -- two
# plugin `SessionStart` hooks firing inside every headless spawn:
#
#   PONYTAIL MODE ACTIVE -- "You are a lazy senior developer... shortest diff wins"
#   CAVEMAN MODE ACTIVE  -- "Respond terse like smart caveman. Drop articles..."
#
# Nobody wrote those for a stage, and `implementing` was writing merged code
# under them. Measured `claude-haiku-4-5-20251001`, 2026-08-22, same cwd and
# toolset: 22,478 tokens of opening context -> 17,086 with this and
# `--disable-slash-commands`.
#
# What it costs, all three verified 2026-08-22 by A/B against a live spawn --
# same cwd, the flag as the only variable. Do not restate any of this from
# memory; an earlier draft of this comment claimed the opposite of the first
# one and a review caught it:
#
#   * The operator's `~/.claude/CLAUDE.md` STOPS reaching stages. The project
#     `CLAUDE.md` still loads; the user-level one does not. Anything a stage
#     genuinely needs belongs in the project file or the stage prompt, which
#     is where it should have been -- the global file told every stage to use
#     skills and an `AskUserQuestion` tool that a headless stage has never had.
#   * Operator `permissions.deny` rules stop applying. They DO survive
#     `bypassPermissions` (`Bash(git worktree remove:*)` in a user/local source
#     came back "Permission to use Bash ... has been denied" without the flag,
#     and ran with it), so this is a real net removed -- for anyone whose
#     `~/.claude/settings.json` carries one. A deny rule in the worktree's own
#     project source no longer binds either: `strip_settings_sources()` removes
#     `<worktree>/.claude/settings.json` before every spawn, so the pipeline's
#     own `--settings` file is the only place left that a rule binds.
#   * `apiKeyHelper`, `env` and `awsAuthRefresh` live in user settings too. Auth
#     by OAuth or `ANTHROPIC_API_KEY` is unaffected (every spawn in the session
#     that added this authenticated fine), but a machine that puts auth or a
#     proxy endpoint in user settings will spawn stages that cannot reach the
#     API, write no `.result`, and burn `no_result` to escalation. This flag is
#     hard-coded here with no per-project override; that is the first thing to
#     revisit if stages start failing on a new machine.
#
# What it does NOT cost is the guard. Same axis as `--bare` and it lands on the
# right side of it: `--settings` is an explicit flag, unaffected by
# `--setting-sources`, so the guard still registers. Verified 2026-08-22 under
# BOTH this and `--disable-slash-commands` -- `git worktree remove foo` came
# back "Blocked by the pipeline guard (this stage): worktrees are the
# dispatcher's to manage." That verification is the condition of using it
# (invariant 4); redo it if either flag changes.
#
# Unrelated to this flag but found while verifying it: a `write: true` stage
# could disable its own guard by writing `<worktree>/.claude/settings.json` =
# `{"disableAllHooks": true}`, which drops the `--settings` PreToolUse hook
# with it. Measured identical with and without `--setting-sources project` --
# the project source was already loaded, so this predated the flag. Fixed by
# `strip_settings_sources()` in `pipeline/core/worktree.py`, which the
# dispatcher runs before every spawn and before a read-only stage's baseline
# snapshot.
cmd = """claude -p --model {model} {effort_flag} {session_flag} {settings_flag} \
--output-format stream-json --verbose \
--setting-sources project \
--append-system-prompt "$(cat {stage_prompt})" \
--tools "{tools}" --strict-mcp-config {mcp_flag} {skills_flag} \
--permission-mode {permission_mode} \
--max-budget-usd {cap} \
--add-dir {project}/.project -- \
"Work ticket {id}. Your prompt carries a bounded view of {ticket}; open that file only for what the view says it omitted, and read only the lines you need. When finished write {result_file}" """

# The same stage, hosted on a PTY the daemon owns (`mode: interactive` in the
# stage's frontmatter). No `-p`: that is the whole point -- print mode has no
# terminal to ask on and AskUserQuestion is not in its toolset, so a permission
# prompt or an option picker cannot exist there. (`--permission-mode` itself
# does take effect under `-p` -- verified 2026-08-21 -- which is what makes
# `bypassPermissions` above the fix for headless stages.) `--max-budget-usd`
# and `--tools` stay: they work outside print mode and they are the money guard.
# A harness without this key falls back to `cmd` under the PTY.
interactive_cmd = """claude --model {model} {effort_flag} {session_flag} {settings_flag} \
--setting-sources project \
--append-system-prompt "$(cat {stage_prompt})" \
--tools "{tools}" --strict-mcp-config {mcp_flag} {skills_flag} \
--permission-mode {permission_mode} \
--max-budget-usd {cap} \
--add-dir {project}/.project -- \
"Work ticket {id}. Your prompt carries a bounded view of {ticket}; open that file only for what the view says it omitted, and read only the lines you need. When finished write {result_file}" """
